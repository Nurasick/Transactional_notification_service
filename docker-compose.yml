services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: Qqwerty1!
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --save ""

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a locally installed Postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: Qqwerty1!
      POSTGRES_DB: mydb
    volumes:
      - ./migrations/001_create_notifications.sql:/docker-entrypoint-initdb.d/001_create_notifications.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Official minio/minio images were removed from Docker Hub; pgsty is a maintained community fork.
  minio:
    image: pgsty/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  # Waits for MinIO, creates the bucket and uploads ./templates/*.html
  minio-init:
    image: pgsty/mc
    restart: "no"
    depends_on:
      - minio
    volumes:
      - ./templates:/templates:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio...'; sleep 2; done;
      mc mb local/notifications-templates --ignore-existing;
      mc cp /templates/*.html local/notifications-templates/;
      exit 0;
      "